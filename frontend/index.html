<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="description"
            content="Termorize helps you translate and save vocabulary, then sends random daily exercises automatically through Telegram."
        />
        <script>
            ;(function () {
                const palettes = ['evergreen', 'sage', 'emerald']
                const palette = localStorage.getItem('palette')
                document.documentElement.setAttribute(
                    'data-theme',
                    palettes.indexOf(palette) !== -1 ? palette : 'evergreen'
                )

                const theme = localStorage.getItem('theme')
                if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                    document.documentElement.style.colorScheme = 'dark'
                } else {
                    document.documentElement.style.colorScheme = 'light'
                }
            })()
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Termorize</title>
        <!--# include virtual="/api/public/collection-share-metadata?path=$request_uri" -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
