<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="description"
            content="Termorize helps you translate and save vocabulary, then sends random daily exercises automatically through Telegram."
        />
        <script>
            ;(function () {
                const palettes = ['evergreen', 'sage', 'emerald']
                const palette = localStorage.getItem('palette')
                document.documentElement.setAttribute(
                    'data-theme',
                    palettes.indexOf(palette) !== -1 ? palette : 'evergreen'
                )

                const theme = localStorage.getItem('theme')
                if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                    document.documentElement.style.colorScheme = 'dark'
                } else {
                    document.documentElement.style.colorScheme = 'light'
                }
            })()
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Termorize</title>
        <!--# include virtual="/api/public/collection-share-metadata?path=$request_uri" -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
    </head>
    <body>
        <!--
        THESIS: A published collection is a readable vocabulary ledger before it is an account prompt; refuse card-based marketing.
        OWN-WORLD: Deep evergreen ground, cool-white type, muted sage rules, compact controls, and word-first rows from established Termorize.
        STORY: Visitors identify the collection, verify its author, languages, and full contents, then sign in or try a guest account to use the words.
        FIRST VIEWPORT: Brand and published status frame a two-column desktop introduction: title and metadata lead left, one login rail sits right, and the ordered list begins below. Mobile preserves that order with one boundary.
        FORM: Typography-led collection ledger, first and only scoped form; seed key LOCAL-EXTENSION-NO-ROLL under the narrow-request exemption.
        FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, PRODUCT.md, and every shipping raster carrying its provenance
        -->
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
